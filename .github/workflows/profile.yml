name: Refresh profile graphics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'MattoYuzuru/MattoYuzuru' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate light statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: "2.2.0"
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&disable_animations=true&card_width=440&custom_title=GitHub%20activity&title_color=237A65&icon_color=237A65&text_color=263C37&bg_color=F5F8F6&border_color=D8E5DD
          path: profile/stats-light.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      - name: Generate dark statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          core_version: "2.2.0"
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&disable_animations=true&card_width=440&custom_title=GitHub%20activity&title_color=8ED6B6&icon_color=8ED6B6&text_color=C9D8D0&bg_color=111B17&border_color=2D4237
          path: profile/stats-dark.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          core_version: "2.2.0"
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=Jupyter%20Notebook&disable_animations=true&card_width=360&custom_title=Public%20code&title_color=237A65&text_color=263C37&bg_color=F5F8F6&border_color=D8E5DD
          path: profile/languages-light.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          core_version: "2.2.0"
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=Jupyter%20Notebook&disable_animations=true&card_width=360&custom_title=Public%20code&title_color=8ED6B6&text_color=C9D8D0&bg_color=111B17&border_color=2D4237
          path: profile/languages-dark.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-light.svg?color_snake=%23237A65
            profile/snake-dark.svg?palette=github-dark&color_snake=%238ED6B6

      - name: Validate and normalize graphics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          paths = list(Path("profile").glob("*.svg"))
          if len(paths) != 6:
              raise SystemExit("Expected six profile graphics")
          for path in paths:
              content = path.read_text()
              root = ElementTree.fromstring(content)
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG: {path}")
              if "Something went wrong" in content:
                  raise SystemExit(f"Error card: {path}")
              path.write_text("\n".join(line.rstrip() for line in content.splitlines()).rstrip() + "\n")
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: profile-graphics
          path: profile/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: profile-graphics
          path: profile
      - name: Commit changed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): refresh GitHub graphics"
          git push
